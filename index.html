<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>EduNexa AI - JAMB, WAEC & NECO CBT Coach</title>
    <meta name="description" content="EduNexa AI: Your personal JAMB, WAEC & NECO exam coach with past questions, AI tutor, and personalized study plans." />
    
    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#047857" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduNexa AI" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- OpenGraph & Social Cards -->
    <meta property="og:title" content="EduNexa AI - JAMB, WAEC & NECO CBT Coach" />
    <meta property="og:description" content="EduNexa AI: Your personal JAMB, WAEC & NECO exam coach with past questions, AI tutor, and personalized study plans." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- DNS prefetch & Preconnect for fast loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking asynchronous typography with native font fallbacks -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&display=swap" />
    </noscript>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-emerald-500 selection:text-white">
    <!-- Instant Native Splash Screen (Visible in <50ms even on 2G/3G before JS loads) -->
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <!-- Brand Badge -->
        <div style="width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg, #059669, #047857); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(5, 150, 105, 0.45); margin-bottom: 20px;">
          <span style="font-size: 34px;">🇳🇬</span>
        </div>
        
        <h1 style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px; margin: 0 0 8px 0; color: #ffffff;">EduNexa AI</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 24px 0; max-width: 290px; line-height: 1.5;">
          JAMB, WAEC & NECO Exam Prep<br />
          <span style="color: #10b981; font-weight: 600;">⚡ Optimized for low-data & fast loading</span>
        </p>

        <!-- Fast CSS Loading Bar -->
        <div style="width: 140px; height: 4px; background: #1e293b; border-radius: 99px; overflow: hidden; position: relative; margin-bottom: 12px;">
          <div style="width: 45%; height: 100%; background: #10b981; border-radius: 99px; position: absolute; animation: prepmasterload 1.1s infinite ease-in-out;"></div>
        </div>
        <span style="font-size: 11px; color: #64748b; font-weight: 500;">Starting your study session...</span>
        
        <style>
          @keyframes prepmasterload {
            0% { left: -50%; }
            100% { left: 100%; }
          }
        </style>
      </div>
    </div>

    <!-- Service Worker Registration for Offline Caching -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {
            // Silently fallback if service workers are restricted in certain iframes
          });
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
