<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b132b">
<title>Forgot Password — PrepMaster AI</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body style="background:var(--pm-bg-canvas);">

<header style="padding:16px 20px; border-bottom:1px solid #e2e8f0; background:#fff; text-align:center;">
  <a href="/" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none;">
    <img src="/icons/icon-192.png" width="32" height="32" style="border-radius:8px;" alt="Logo">
    <div style="font-weight:800; font-size:1.15rem; color:#0f172a;">
      PrepMaster <span style="color:#2563eb;">AI</span>
    </div>
  </a>
</header>

<main class="pm-container-narrow" style="padding-top:40px;">
  <div style="text-align:center; margin-bottom:24px;">
    <h1 style="font-size:1.8rem; margin-bottom:6px;">Reset Password</h1>
    <p class="muted">We'll send a 6-digit verification code directly to your WhatsApp</p>
  </div>

  <div class="pm-card" style="box-shadow:var(--pm-shadow-lg); padding:28px 24px;">
    <form id="forgot-form">
      <div class="pm-form-group">
        <label class="pm-label" for="phone">Your WhatsApp Phone Number</label>
        <input id="phone" type="tel" class="pm-input" required placeholder="e.g. 08160754659" autocomplete="tel">
      </div>

      <button id="submit-btn" type="submit" class="pm-btn pm-btn-primary pm-btn-lg pm-btn-block">
        Send Reset Code &rarr;
      </button>
    </form>

    <div id="msg" class="pm-card" style="display:none; background:#ecfdf5; border-color:#a7f3d0; color:#065f46; padding:12px; margin-top:16px; font-size:0.88rem;"></div>

    <div style="text-align:center; margin-top:20px; font-size:0.9rem;">
      <a href="/login.html" style="font-weight:700;">&larr; Back to Log In</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/site.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const phone = document.getElementById('phone').value.trim();
  btn.disabled = true;
  btn.textContent = 'Sending code…';

  try {
    await api('/auth/forgot-password', { method: 'POST', body: { phone } });
    const msgEl = document.getElementById('msg');
    msgEl.textContent = 'A 6-digit reset code has been sent to your WhatsApp number.';
    msgEl.style.display = 'block';
    setTimeout(() => {
      window.location.href = '/reset-password.html?phone=' + encodeURIComponent(phone);
    }, 1200);
  } catch {
    const msgEl = document.getElementById('msg');
    msgEl.textContent = 'A reset code has been sent to your WhatsApp number.';
    msgEl.style.display = 'block';
  }
});
</script>
</body>
</html>
