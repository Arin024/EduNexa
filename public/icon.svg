<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Decorative border ring -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#34d399" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Graduation Cap / Scholar Emblem -->
  <g transform="translate(256, 230)">
    <!-- Cap top diamond -->
    <polygon points="0,-90 150,-15 0,60 -150,-15" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.2))"/>
    <polygon points="0,-80 135,-15 0,50 -135,-15" fill="#f8fafc"/>
    <!-- Cap skull cap base -->
    <path d="M-85,15 C-85,75 85,75 85,15" fill="#e2e8f0"/>
    <!-- Gold Tassel -->
    <circle cx="0" cy="-15" r="10" fill="url(#gold)"/>
    <path d="M0,-15 Q90,0 105,70" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <polygon points="100,70 110,70 115,100 95,100" fill="url(#gold)"/>
  </g>

  <!-- Lettermark PrepMaster -->
  <text x="256" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PREPMASTER</text>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="4">AI COACH</text>
</svg>
