<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b132b">
<title>Offline — PrepMaster AI</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="pm-body-dark">
<div class="pm-min-screen pm-flex-center" style="padding: 24px;">
  <div class="pm-card pm-card-glass pm-text-center" style="max-width: 420px; width: 100%; padding: 36px 24px;">
    <div class="pm-icon-badge pm-badge-amber" style="width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px; font-size: 28px;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1 style="font-size: 1.5rem; margin-bottom: 8px; color: #fff;">You're Currently Offline</h1>
    <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px;">
      PrepMaster AI needs an internet connection to sync your questions and study progress. Cached pages will remain accessible.
    </p>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <button onclick="window.location.reload()" class="pm-btn pm-btn-primary" style="width: 100%;">
        Try Reconnecting
      </button>
      <a href="/dashboard.html" class="pm-btn pm-btn-secondary" style="width: 100%;">
        Go to Cached Dashboard
      </a>
    </div>
  </div>
</div>
</body>
</html>
