<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b132b">
<title>Reset Password — PrepMaster AI</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body style="background:var(--pm-bg-canvas);">

<header style="padding:16px 20px; border-bottom:1px solid #e2e8f0; background:#fff; text-align:center;">
  <a href="/" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none;">
    <img src="/icons/icon-192.png" width="32" height="32" style="border-radius:8px;" alt="Logo">
    <div style="font-weight:800; font-size:1.15rem; color:#0f172a;">
      PrepMaster <span style="color:#2563eb;">AI</span>
    </div>
  </a>
</header>

<main class="pm-container-narrow" style="padding-top:40px;">
  <div style="text-align:center; margin-bottom:24px;">
    <h1 style="font-size:1.8rem; margin-bottom:6px;">Enter Verification Code</h1>
    <p class="muted">Check WhatsApp for your 6-digit code (valid for 15 minutes)</p>
  </div>

  <div class="pm-card" style="box-shadow:var(--pm-shadow-lg); padding:28px 24px;">
    <form id="reset-form">
      <div class="pm-form-group">
        <label class="pm-label" for="phone">WhatsApp Phone Number</label>
        <input id="phone" class="pm-input" required placeholder="e.g. 08160754659" inputmode="tel">
      </div>

      <div class="pm-form-group">
        <label class="pm-label" for="code">6-Digit Code</label>
        <input id="code" class="pm-input" required maxlength="6" inputmode="numeric" placeholder="123456" style="font-family:var(--pm-font-mono); font-size:1.1rem; letter-spacing:0.15em;">
      </div>

      <div class="pm-form-group">
        <label class="pm-label" for="password">New Password</label>
        <input id="password" type="password" class="pm-input" required minlength="8" placeholder="At least 8 characters">
      </div>

      <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
        <input type="checkbox" id="show-password" style="width:16px; height:16px;">
        <label for="show-password" style="margin:0; font-size:0.85rem; color:#64748b; cursor:pointer;">Show password</label>
      </div>

      <div id="error" class="pm-card" style="display:none; background:#fff1f2; border-color:#fecdd3; color:#be123c; padding:12px; font-size:0.88rem; margin-bottom:16px;"></div>

      <button id="submit-btn" type="submit" class="pm-btn pm-btn-primary pm-btn-lg pm-btn-block">
        Reset Password
      </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:0.9rem;">
      <a href="/forgot-password.html" style="font-weight:700;">Didn't get a code? Request new code</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/site.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get('phone')) {
  document.getElementById('phone').value = params.get('phone');
}

document.getElementById('show-password').addEventListener('change', (e) => {
  document.getElementById('password').type = e.target.checked ? 'text' : 'password';
});

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Updating password…';

  try {
    await api('/auth/reset-password', {
      method: 'POST',
      body: {
        phone: document.getElementById('phone').value.trim(),
        code: document.getElementById('code').value.trim(),
        newPassword: document.getElementById('password').value,
      },
    });
    showToast('Password reset successfully! Please log in.');
    setTimeout(() => {
      window.location.href = '/login.html';
    }, 1200);
  } catch (err) {
    errEl.textContent = 'That code is invalid or has expired. Please request a new one.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
